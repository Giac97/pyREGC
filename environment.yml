# Complete mamba/conda environment for regc (workstation or cluster login node):
#
#   mamba env create -f environment.yml        # from the repository root
#   mamba activate gcmc_re
#   pytest                                      # optional: run the test suite
#
# It installs this package in editable mode (pip -e .), so edits to regc/
# take effect without reinstalling. Update an existing env after changing this
# file with:  mamba env update -f environment.yml --prune
#
# LAMMPS comes from conda-forge (serial CPU build with the Python module and the
# MANYBODY / ML-PACE / EXTRA-FIX packages regc uses: eam/fs, pace, grace/fs).
# For GRACE-1L/2L/3L models (pair_style grace/runtime), additionally run
# `bash hpc/build_lammps.sh`: it adds liblammps_grace.so to this env, selected
# with lammps_name: grace / REGC_LAMMPS_NAME=grace. Keep the `lammps` line below.
name: gcmc_re
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.22
  - scipy>=1.7
  - ase>=3.23
  - pymbar>=4.0
  - matplotlib>=3.5
  - pyyaml>=6.0
  - lammps=*=cpu*nompi*        # serial CPU build with Python bindings
  - pytest>=7.0
  - pip
  - pip:
      - -e .
      # Optional: GRACE models through their ASE calculator (TensorFlow, large):
      # - tensorpotential
